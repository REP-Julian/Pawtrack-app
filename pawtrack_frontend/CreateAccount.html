<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background: url("/resources/image/background.png") no-repeat center center fixed;
            background-size: cover;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw Track - Create Account</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="overlay-container">
<div class="glass-card signup-card">
        <div class="header-section">
            <div class="logo-area">
                <div class="logo-placeholder">
                    <img src="/resources/image/Logo.png" alt="Paw Track" class="brand-logo">
                </div>
            </div>
            <h2>Create Your Account</h2>
            <p>Simple, secure and fast — create your PawTrack account</p>
        </div>

        <form id="signupForm" class="signup-grid">
            <div class="form-group">
                <label for="signupLastName">Last Name:</label>
                <input type="text" id="signupLastName" placeholder="Enter last name" required autocomplete="family-name">
            </div>
            <div class="form-group">
                <label for="signupFirstName">First Name:</label>
                <input type="text" id="signupFirstName" placeholder="Enter first name" required autocomplete="given-name">
            </div>
            <div class="form-group">
                <label for="signupMiddleName">Middle Name:</label>
                <input type="text" id="signupMiddleName" placeholder="Enter middle name" autocomplete="additional-name">
            </div>
            <div class="form-group">
                <label for="signupContact">Contact Number:</label>
                <input type="tel" id="signupContact" placeholder="e.g. 09123456789" required autocomplete="tel">
            </div>
            <div class="form-group full-width">
                <label for="signupEmail">Email Address:</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group full-width">
                <label for="signupUsername">Username:</label>
                <input type="text" id="signupUsername" placeholder="Choose a username (e.g. johnsmith)" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" class="pass-field" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="signupRepeatPassword">Repeat Password:</label>
                <input type="password" id="signupRepeatPassword" class="pass-field" placeholder="Confirm password" required minlength="8" autocomplete="new-password">
            </div>

            <div class="full-width">
                <label class="checkbox-container">
                    <input type="checkbox" id="showPasswords"> Show Passwords
                </label>
            </div>

            <div class="form-footer full-width">
                <a href="/PawTrackLogin.html" class="back-link">← BACK TO LOGIN</a>
                <button type="submit" class="btn-login-small">CREATE ACCOUNT</button>
            </div>
        </form>
    </div>
</div>
<div class="floating-popup-box" id="floatingPopupBox">
    <button class="custom-popup-close" id="floatingPopupClose">&times;</button>
    <h2 class="custom-popup-title title-success" id="floatingPopupTitle">Title</h2>
    <p class="custom-popup-message" id="floatingPopupMessage">Message goes here.</p>
</div>

<script type="module" src="/script.js"></script>
</body>
</html>
